name: Daily Article Generator

on:
  schedule:
    # Hora España en verano (CEST = UTC+2):
    # 08:00 CEST = 06:00 UTC
    # 13:00 CEST = 11:00 UTC
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:   # permite ejecutar manualmente desde GitHub Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Generate and publish article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AMAZON_TAG: setupoficina-21
        run: node scripts/generate-article.mjs
